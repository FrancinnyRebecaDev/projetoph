<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#171715">
    <title>Painel administrativo | Gabriel Dinis</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>
<body>
    <header class="topbar">
        <a class="brand" href="index.html" aria-label="Gabriel Dinis, painel administrativo">
            <span class="brand-mark" aria-hidden="true">GD</span>
            <span class="brand-name">Gabriel Dinis</span>
        </a>
        <span class="admin-label"><span class="status-dot" aria-hidden="true"></span> Painel administrativo</span>
    </header>

    <main class="layout">
        <section class="intro" aria-labelledby="page-title">
            <p class="eyebrow">GESTÃO DA BARBEARIA</p>
            <h1 id="page-title">Serviços</h1>
            <p class="intro-copy">Cadastre e organize os serviços oferecidos.</p>
        </section>

        <div class="workspace">
            <section class="form-panel" aria-labelledby="form-title">
                <div class="section-heading">
                    <span class="heading-index">01</span>
                    <div>
                        <p class="eyebrow">NOVO CADASTRO</p>
                        <h2 id="form-title">Adicionar serviço</h2>
                    </div>
                </div>

                <form id="form-servico">
                    <div class="field">
                        <label for="nome">Nome do Serviço</label>
                        <input id="nome" name="nome" type="text" maxlength="80" placeholder="Ex.: Corte clássico" required>
                    </div>

                    <div class="field">
                        <label for="tipo">Tipo/Categoria</label>
                        <select id="tipo" name="tipo" required>
                            <option value="" disabled selected>Selecione uma categoria</option>
                            <option value="Corte">Corte</option>
                            <option value="Barba">Barba</option>
                            <option value="Combo">Combo</option>
                            <option value="Tratamento">Tratamento</option>
                        </select>
                    </div>

                    <div class="field-row">
                        <div class="field">
                            <label for="duracao">Duração (minutos)</label>
                            <input id="duracao" name="duracao" type="number" min="1" max="600" step="1" placeholder="30" required>
                        </div>
                        <div class="field">
                            <label for="preco">Preço (R$)</label>
                            <input id="preco" name="preco" type="number" min="0.01" step="0.01" placeholder="45,00" required>
                        </div>
                    </div>

                    <button class="submit-button" type="submit"><span aria-hidden="true">+</span> Cadastrar serviço</button>
                    <p id="aviso-formulario" class="form-message" role="status" aria-live="polite"></p>
                </form>
            </section>

            <section class="services-panel" aria-labelledby="services-title">
                <div class="services-heading">
                    <div class="section-heading">
                        <span class="heading-index">02</span>
                        <div>
                            <p class="eyebrow">CATÁLOGO</p>
                            <h2 id="services-title">Serviços cadastrados</h2>
                        </div>
                    </div>
                    <span id="contador-servicos" class="count-badge">0</span>
                </div>
                <div id="lista-servicos" class="services-list" aria-live="polite"></div>
            </section>
        </div>
    </main>

    <footer class="footer">Gabriel Dinis <span>·</span> Administração</footer>
</body>
</html>
