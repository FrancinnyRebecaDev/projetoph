<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Finalizar agendamento</title>
  <link rel="stylesheet" href="login.css">
</head>
<body>
  <main class="login-container">
    <h1>Finalizar agendamento</h1>
    <p>Preencha os dados para finalizar o seu agendamento.</p>

    <form id="whatsappForm">
      <div class="input-group">
        <label for="nome">Seu nome:</label>
        <input
          type="text"
          id="nome"
          name="nome"
          placeholder="Digite seu nome completo"
          autocomplete="name"
          required
        >
      </div>

      <div class="input-group">
        <label for="contato">Celular (WhatsApp):</label>
        <input
          type="tel"
          id="contato"
          name="contato"
          placeholder="Ex.: 5511999999999"
          autocomplete="tel"
          inputmode="tel"
          required
        >
      </div>

      <button type="submit">Finalizar agendamento</button>
    </form>
  </main>

  <script src="login.js"></script>
</body>
</html>
